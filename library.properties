sentence=Fermion optical odometry module based on PixArt PAA5160E1-Q, reports X/Y displacement over I2C or UART.
paragraph=The module integrates PAA5160E1-Q optical tracking chip and an on-board MCU; the host reads accumulated X/Y displacement in centimeters. It supports I2C (default address 0x11) and MODBUS-RTU UART, selected by the mode pin at power-on.
